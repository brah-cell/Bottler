name: Build

# Compiles Bottler on a real macOS runner for every push and pull request,
# so a change that breaks the build is caught before a release is tagged.

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -c release
